content_version: 0.1.0

# This file is fictional. Copy it outside tracked source control, replace the
# example content with reviewed owner-approved evidence, and keep private data
# under an ignored local path.
profile:
  # Replace this only with an owner-reviewed summary before setting
  # runtime_included to true. The safe default is withheld.
  summary: No reviewed profile summary is available.
  runtime_included: false
  sensitivity: private
  source_refs:
    - src_persona_yaml_current

sources:
  - id: src_persona_yaml_current
    source_type: persona_yaml
    authorship: mixed
    locator: local active persona.yaml
    summary: Owner-reviewed claims imported from the active local persona.
    sensitivity: private
    runtime_excerpt_allowed: true

  # To authorize completed human validation answers, add one reviewed source per
  # survey, set validation_survey_id to the exact survey ID, and include the
  # source ID under consent.allowed_sources.
  # - id: src_human_validation_choices
