  #   authorship: person
  #   validation_survey_id: choices
  #   locator: local validation results, choices survey, human answers
  #   summary: Direct human answers to the reviewed choices survey.
  #   sensitivity: private
  #   runtime_excerpt_allowed: true

  # Group sources for evaluation ablations with an optional evidence_set ID.
