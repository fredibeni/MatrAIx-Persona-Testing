decision_cases: []
decision_policies: []
counterexamples: []
conflicts: []

current_state: {}

consent:
  # Change to true only after the owner reviews the source and intended uses.
  owner_authorized: false
  authorized_at: null
  allowed_sources:
    - src_persona_yaml_current
  allowed_modes:
    - predict-choice
    - write-in-style
  allowed_uses:
    - predict likely choices
    - draft in documented communication style
  prohibited_uses:
    - execute external actions
    - claim literal identity
  publication_requires_fresh_approval: true

boundaries:
  ask_before:
    - send any external message
    - make a purchase or commitment

coverage:
  status: development_only
  # Declare a narrow evaluation taxonomy before freezing a holdout. Each value
  # must be a lowercase slug of at most 64 characters. Promotion is limited to
  # these pack-owned domains.
  declared_domains: []
  # Ordinary curation must leave this empty. Only the separate, hash-bound
  # owner coverage-review workflow can create a non-empty projection.
  validated_domains: []
  # validation_events is compiler-owned and must not be added to curation.
